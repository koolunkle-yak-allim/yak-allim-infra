name: yak-allim-infra

services:
  # Nginx 리버스 프록시 및 무중단(블루-그린) 라우팅 컨트롤러
  nginx:
    image: nginx:alpine
    container_name: yak-allim-nginx
    restart: always
    ports:
      - "80:80"
      # - "443:443"  # TLS 설정 전까지는 열지 않음
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - "${DEPLOY_DIR:-C:/yakallim-deploy}:/var/jenkins_home/deploy"
    networks:
      - app-network
    depends_on:
      - jenkins
      - n8n

  # OCR 분석 및 작업 자동화 엔진
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: yak-allim-n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - "${N8N_DATA_PATH:-C:/n8n_data}:/home/node/.n8n"
    networks:
      - app-network

  # 통합 CI/CD 빌드 및 배포 제어기 (Jenkins Controller with Docker CLI)
  jenkins:
    build:
      context: .
      dockerfile: jenkins.Dockerfile
    image: yak-allim-jenkins-custom:lts
    container_name: yak-allim-jenkins
    user: root
    restart: always
    ports:
      - "127.0.0.1:9090:8080"
      # - "50000:50000"  # JNLP 에이전트 연결을 쓰지 않아 제거 (Dynamic Docker Agent는 내부 네트워크로 연결됨)
    environment:
      - TZ=Asia/Seoul
    volumes:
      - jenkins_home:/var/jenkins_home
      - "${DEPLOY_DIR:-C:/yakallim-deploy}:/var/jenkins_home/deploy"
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-network

# 서비스 및 백엔드/클라이언트 배포 공용 네트워크
networks:
  app-network:
    name: app-network
    driver: bridge

# 영속성 데이터 스토리지
volumes:
  jenkins_home:
    name: jenkins_home
