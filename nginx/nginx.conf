user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Nginx 버전 정보 노출 차단 설정
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access_log.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    
    # 클라이언트 연결 유지 시간 및 MIME 타입 해시 크기 설정
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 요청 본문 기본 제한. 이미지 업로드 경로(/api/v1/ocr/)는 default.conf에서 서버와 같은 10M로 지정한다.
    client_max_body_size 1M;
    # 메모리 버퍼 용량 확충 목적의 디스크 I/O 최적화 설정
    client_body_buffer_size 1M;

    # 응답 데이터 Gzip 압축 대상 지정 네트워크 최적화
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}
