# Docker 내장 DNS 명칭 동적 해석
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # 무중단(Blue-Green) 배포용 동적 타겟 URL 참조 파일
    include /etc/nginx/conf.d/service-url.inc;

    # 클라이언트 식별 정보 전달 및 HTTP/1.1 커넥션 유지 헤더
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 운영 관리·디버그 엔드포인트 외부 접근 차단 (Swagger UI/스펙은 포트폴리오 공개 목적으로 제외)
    location ~ ^/(actuator|h2-console)(/|$) {
        return 404;
    }

    # Spring Boot API 라우팅 경로
    location / {
        proxy_pass $service_url;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # SSE 스트리밍 및 프록시 버퍼링 방지
        proxy_buffering off;
        proxy_cache off;
    }

    # OCR 진행률 SSE 스트리밍 경로 (버퍼링 없이 장시간 연결 유지)
    location ~ ^/api/v1/ocr/jobs/[^/]+/progress$ {
        proxy_pass $service_url;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # SSE 스트리밍 및 프록시 버퍼링 방지
        proxy_buffering off;
        proxy_cache off;
    }

    # OCR 분석 처리 엔드포인트 경로 (서버의 spring.servlet.multipart.max-file-size와 동일하게 제한)
    location /api/v1/ocr/ {
        proxy_pass $service_url;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }

    # 헬스체크 응답 엔드포인트
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # n8n(5678), Jenkins(9090)는 127.0.0.1 바인딩 포트로 직접 접근.
    # Docker 포트 NAT 특성상 여기 allow/deny로는 클라이언트 IP를 신뢰할 수 없어
    # 프록시 location을 두지 않음.
}
